<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Iniciar Sesión</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>
        <ion-label position="floating">Usuario</ion-label>
        <ion-input 
          [(ngModel)]="user.usuario"
          minlength="3"
          maxlength="8">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input 
          type="password"
          inputmode="numeric"
          [(ngModel)]="user.password"
          maxlength="4">
        </ion-input>
      </ion-item>

      <ion-button expand="full" (click)="ingresar()">
        Ingresar
      </ion-button>

    </ion-card-content>
  </ion-card>

</ion-content>
