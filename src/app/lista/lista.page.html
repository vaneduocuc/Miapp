<ion-header>
  <ion-toolbar>
    <ion-title>Lista de Estudiantes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>
    <ion-item *ngFor="let estudiante of estudiantes">
      <ion-label>
        <h2>{{ estudiante.nombre }} {{ estudiante.apellido }}</h2>
        
        <p><strong>Carrera:</strong> {{ estudiante.Carrera }}</p>
        <p><strong>F. Nacimiento:</strong> {{ estudiante.fechaNacimiento }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
